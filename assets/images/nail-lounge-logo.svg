<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Rich Metallic Burgundy Gradient -->
    <radialGradient id="burgundyGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#99152B"/>
      <stop offset="60%" stop-color="#70091C"/>
      <stop offset="100%" stop-color="#4A0411"/>
    </radialGradient>

    <!-- Warm Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8"/>
      <stop offset="25%" stop-color="#D7B576"/>
      <stop offset="50%" stop-color="#F5E8CE"/>
      <stop offset="75%" stop-color="#C19750"/>
      <stop offset="100%" stop-color="#8F6827"/>
    </linearGradient>

    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C19750" stop-opacity="0"/>
      <stop offset="30%" stop-color="#EEDBB7" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFF5E0" stop-opacity="1"/>
      <stop offset="70%" stop-color="#D7B576" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8F6827" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Luxury Depth -->
    <filter id="luxeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A0411" flood-opacity="0.32"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#FFE4B5" flood-opacity="0.25"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow / Shadow -->
  <circle cx="250" cy="250" r="236" fill="url(#burgundyGrad)" filter="url(#luxeShadow)"/>

  <!-- Outer Double Gold Rings -->
  <circle cx="250" cy="250" r="234" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3, 3" opacity="0.8"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Inner Concentric Frame -->
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5"/>

  <!-- Subtle Radial Sunburst Rays in Background -->
  <g opacity="0.07" stroke="#FFF" stroke-width="1">
    <line x1="250" y1="40" x2="250" y2="460"/>
    <line x1="40" y1="250" x2="460" y2="250"/>
    <line x1="102" y1="102" x2="398" y2="398"/>
    <line x1="102" y1="398" x2="398" y2="102"/>
  </g>

  <!-- ==================== TOP LOTUS / BLOSSOM EMBLEM ==================== -->
  <g transform="translate(250, 142) scale(0.92)">
    <!-- Center Blooming Petal -->
    <path d="M0 -56 C-12 -32 -18 -8 0 16 C18 -8 12 -32 0 -56 Z" fill="url(#goldGrad)" filter="url(#innerGlow)"/>
    <!-- Left Blooming Petal -->
    <path d="M-4 10 C-26 6 -48 -14 -44 -38 C-34 -18 -18 0 -4 10 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Right Blooming Petal -->
    <path d="M4 10 C26 6 48 -14 44 -38 C34 -18 18 0 4 10 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Far Left Wing Petal -->
    <path d="M-8 14 C-36 18 -66 -2 -60 -20 C-46 -6 -24 6 -8 14 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Far Right Wing Petal -->
    <path d="M8 14 C36 18 66 -2 60 -20 C46 -6 24 6 8 14 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Lotus Base Crescent / Pedestal -->
    <path d="M-28 20 Q0 30 28 20 Q0 24 -28 20 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="23" r="2.5" fill="#FFE8BF"/>
  </g>

  <!-- Little Delicate Star Accent Above Text -->
  <g transform="translate(250, 192)">
    <polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="url(#goldGrad)"/>
  </g>

  <!-- ==================== MAIN LOGO TEXT ==================== -->
  <!-- "THE NAIL" Serif Display Typography -->
  <text x="250" y="256" text-anchor="middle"
        font-family="Playfair Display, Didot, Georgia, serif"
        font-size="44"
        font-weight="700"
        letter-spacing="5"
        fill="url(#goldGrad)"
        filter="url(#innerGlow)">THE NAIL</text>

  <!-- Horizontal Fine Gold Accent Line with Center Diamond -->
  <line x1="110" y1="282" x2="390" y2="282" stroke="url(#goldGradH)" stroke-width="1.2"/>
  <polygon points="250,278 254,282 250,286 246,282" fill="url(#goldGrad)"/>

  <!-- "LOUNGE & SPA" Tracked Luxury Sans-Serif -->
  <text x="250" y="322" text-anchor="middle"
        font-family="DM Sans, Montserrat, -apple-system, sans-serif"
        font-size="18.5"
        font-weight="500"
        letter-spacing="9"
        fill="url(#goldGrad)">LOUNGE &amp; SPA</text>

  <!-- Lower Decorative Arch / Tagline -->
  <g transform="translate(250, 362)">
    <!-- Small Diamond Dots -->
    <circle cx="-54" cy="0" r="2" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="54" cy="0" r="2" fill="url(#goldGrad)" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle"
          font-family="DM Sans, sans-serif"
          font-size="11"
          font-weight="400"
          letter-spacing="4"
          fill="#DFC286"
          opacity="0.9">CAROLINE&#39;S PLACE</text>
  </g>

  <!-- Bottom Crest Arc Flourish -->
  <path d="M190 395 Q250 410 310 395" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.55"/>
  <circle cx="250" cy="403" r="2.5" fill="url(#goldGrad)"/>
</svg>