<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600' width='600' height='600'>
  <defs>
    <!-- Background circle shadow -->
    <filter id='drop' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='8' stdDeviation='14' flood-color='#400008' flood-opacity='0.6'/>
    </filter>
    <filter id='innerGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feComposite in2='SourceAlpha' operator='arithmetic' k2='-1' k3='1' result='shadowDiff'/>
      <feFlood flood-color='#ff8598' flood-opacity='0.5'/>
      <feComposite in2='shadowDiff' operator='in'/>
      <feComposite in2='SourceGraphic' operator='over'/>
    </filter>

    <!-- Metallic Ruby Ring Gradient -->
    <radialGradient id='ringGrad' cx='42%' cy='36%' r='65%'>
      <stop offset='0%' stop-color='#e62b46'/>
      <stop offset='30%' stop-color='#b50e26'/>
      <stop offset='60%' stop-color='#7a0515'/>
      <stop offset='85%' stop-color='#9e0e22'/>
      <stop offset='100%' stop-color='#52000b'/>
    </radialGradient>

    <!-- Linear metallic gradient for petals -->
    <linearGradient id='rubyMetal' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ff5c75'/>
      <stop offset='25%' stop-color='#c2132c'/>
      <stop offset='50%' stop-color='#7d0515'/>
      <stop offset='75%' stop-color='#bd152d'/>
      <stop offset='100%' stop-color='#52000b'/>
    </linearGradient>

    <linearGradient id='rubyGleam' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#7d0515'/>
      <stop offset='45%' stop-color='#cf1a34'/>
      <stop offset='55%' stop-color='#ff758d'/>
      <stop offset='70%' stop-color='#b00f24'/>
      <stop offset='100%' stop-color='#61000e'/>
    </linearGradient>

    <!-- Text 3D metallic gradient -->
    <linearGradient id='textRuby' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ff617a'/>
      <stop offset='20%' stop-color='#d41b35'/>
      <stop offset='55%' stop-color='#850616'/>
      <stop offset='85%' stop-color='#ba142b'/>
      <stop offset='100%' stop-color='#54000c'/>
    </linearGradient>
  </defs>

  <!-- Dark outer backing for badge -->
  <circle cx='300' cy='300' r='280' fill='#0a0506' />

  <!-- Outer Beveled Metallic Ring -->
  <circle cx='300' cy='300' r='264' fill='none' stroke='url(#ringGrad)' stroke-width='16' filter='url(#drop)'/>
  <circle cx='300' cy='300' r='272' fill='none' stroke='#ff8598' stroke-width='1.5' opacity='0.75' stroke-dasharray='120 180 80 220'/>
  <circle cx='300' cy='300' r='256' fill='none' stroke='#ff405b' stroke-width='1.5' opacity='0.6'/>
  <circle cx='300' cy='300' r='253' fill='none' stroke='#380007' stroke-width='2'/>

  <!-- Specular glare glints on outer ring -->
  <!-- Top-left glint -->
  <ellipse cx='170' cy='140' rx='36' ry='6' transform='rotate(-40 170 140)' fill='#ffffff' opacity='0.85' filter='blur(2px)'/>
  <!-- Bottom-left glint -->
  <ellipse cx='130' cy='430' rx='28' ry='5' transform='rotate(48 130 430)' fill='#ffffff' opacity='0.75' filter='blur(2px)'/>

  <!-- ==================== LOTUS FLOWER EMBLEM ==================== -->
  <g transform='translate(0, -12)' filter='url(#innerGlow)'>
    <!-- Center Teardrop Petal -->
    <path d='M300,122 C324,170 338,212 300,268 C262,212 276,170 300,122 Z' 
          fill='none' stroke='url(#rubyMetal)' stroke-width='11' stroke-linejoin='round' stroke-linecap='round'/>
    <path d='M300,132 C318,172 328,206 300,250 C272,206 282,172 300,132 Z' 
          fill='none' stroke='#ff7a90' stroke-width='2' opacity='0.7'/>

    <!-- Left Inner Petal -->
    <path d='M300,268 C252,260 216,212 250,158 C276,192 284,232 300,268 Z' 
          fill='none' stroke='url(#rubyGleam)' stroke-width='10.5' stroke-linejoin='round' stroke-linecap='round'/>

    <!-- Right Inner Petal -->
    <path d='M300,268 C348,260 384,212 350,158 C324,192 316,232 300,268 Z' 
          fill='none' stroke='url(#rubyMetal)' stroke-width='10.5' stroke-linejoin='round' stroke-linecap='round'/>

    <!-- Left Outer Flared Wing Petal -->
    <path d='M276,268 C218,272 170,224 200,178 C226,178 250,214 276,268 Z' 
          fill='none' stroke='url(#rubyMetal)' stroke-width='10' stroke-linejoin='round' stroke-linecap='round'/>

    <!-- Right Outer Flared Wing Petal -->
    <path d='M324,268 C382,272 430,224 400,178 C374,178 350,214 324,268 Z' 
          fill='none' stroke='url(#rubyGleam)' stroke-width='10' stroke-linejoin='round' stroke-linecap='round'/>

    <!-- Center bud glint -->
    <circle cx='300' cy='155' r='3.5' fill='#ffffff' opacity='0.9'/>
  </g>

  <!-- ==================== THE NAIL TYPOGRAPHY ==================== -->
  <g id='theNailText' filter='url(#drop)'>
    <text x='300' y='366' 
          font-family='"Playfair Display", "Cinzel", Georgia, serif' 
          font-size='65' 
          font-weight='800' 
          letter-spacing='4' 
          text-anchor='middle' 
          fill='url(#textRuby)' 
          stroke='#ff6e85' 
          stroke-width='1.2' 
          paint-order='stroke fill'>THE NAIL</text>
  </g>

  <!-- ==================== LOUNGE & SPA ==================== -->
  <g id='loungeSpaText'>
    <!-- Left Accent Line -->
    <line x1='112' y1='404' x2='158' y2='404' stroke='url(#rubyMetal)' stroke-width='3.5' stroke-linecap='round'/>
    
    <text x='300' y='412' 
          font-family='"Playfair Display", "Cinzel", Georgia, serif' 
          font-size='27' 
          font-weight='700' 
          letter-spacing='5' 
          text-anchor='middle' 
          fill='url(#textRuby)' 
          stroke='#ff7a90' 
          stroke-width='0.8'>LOUNGE &amp; SPA</text>
          
    <!-- Right Accent Line -->
    <line x1='442' y1='404' x2='488' y2='404' stroke='url(#rubyMetal)' stroke-width='3.5' stroke-linecap='round'/>
  </g>
</svg>